name: Build Debug and Release

on:
  push:
  workflow_dispatch:
    inputs:
      source-ref:
        description: Optional dependency ref (defaults to the engine ref)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Linux x86_64 ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release]
    container:
      image: registry.gitlab.steamos.cloud/steamrt/steamrt4/sdk

    defaults:
      run:
        shell: bash

    env:
      IDK_SOURCE_REF: ${{ inputs.source-ref || github.ref_name }}
      IDK_PRESET: ${{ matrix.preset }}

    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends \
            build-essential \
            ca-certificates \
            cmake \
            git \
            libgl-dev \
            ninja-build \
            pkg-config \
            python3 \
            unzip \
            wget

      # The token needs Contents: Read access to external dependencies and
      # third-party submodules. Checkout converts their SSH URLs to HTTPS.
      - name: Checkout project and dependencies
        uses: actions/checkout@v6
        with:
          path: IDKGameEngine
          submodules: recursive
          token: ${{ secrets.IDK_REPO_READ_TOKEN || github.token }}
          persist-credentials: false

      # These two projects remain independent and sit beside this checkout.
      - name: Checkout idk_game
        uses: actions/checkout@v6
        with:
          repository: IDKGameEngine/idk_game
          ref: ${{ env.IDK_SOURCE_REF }}
          path: idk_game
          token: ${{ secrets.IDK_REPO_READ_TOKEN || github.token }}
          persist-credentials: false

      - name: Checkout libidk
        uses: actions/checkout@v6
        with:
          repository: IDKGameEngine/libidk
          ref: ${{ env.IDK_SOURCE_REF }}
          path: libidk
          token: ${{ secrets.IDK_REPO_READ_TOKEN || github.token }}
          persist-credentials: false

      - name: Build third-party dependencies
        working-directory: IDKGameEngine
        run: ./scripts/dep-build.sh

      - name: Build and install ${{ matrix.preset }}
        working-directory: IDKGameEngine
        run: ./scripts/build.sh --preset="$IDK_PRESET"

      - name: Package ${{ matrix.preset }}
        working-directory: IDKGameEngine
        run: ./scripts/package.sh --preset="$IDK_PRESET"

      - name: Upload ${{ matrix.preset }} artifact
        uses: actions/upload-artifact@v7
        with:
          path: IDKGameEngine/build-${{ matrix.preset }}/idkge-linux-x86_64-${{ matrix.preset }}.tar.gz
          archive: false
          if-no-files-found: error
          retention-days: 30
